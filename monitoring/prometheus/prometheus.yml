global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ---------- Aplikacje (odpalone w konsoli na hoście) ----------
  # Każda musi wystawiać GET /metrics (patrz instrumentation/)
  # Aby zabezpieczyć /metrics, ustaw METRICS_TOKEN w .env i odkomentuj 'authorization' poniżej
  - job_name: backend
    metrics_path: /metrics
    authorization:
      credentials: 'a11c5b9505b1640e97b12ac35a92f4d6c231ae4f3ce4505e1a89b78729c8d9f8'
    static_configs:
      - targets: ['host.docker.internal:4001']

  - job_name: scraper
    metrics_path: /metrics
    authorization:
      credentials: 'b6b6d1735b7e7844bd4ec899442313107b21f699e176ceb871b4416384bfa4de'
    static_configs:
      - targets: ['host.docker.internal:4003']

  - job_name: backend-console
    metrics_path: /api/metrics
    authorization:
      credentials: '045b86c20f59e4983d6ce64cf1b989eb4e808809170f98a25d74133ce70c82ff'
    static_configs:
      - targets: ['host.docker.internal:4002']

  # ---------- Frontendy: tylko probe dostępności ----------
  - job_name: blackbox-frontend
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://host.docker.internal:3000']
        labels: { app: frontend }
      - targets: ['http://host.docker.internal:3001']
        labels: { app: console-frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------- Infrastruktura ----------
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: postgres-crm
    static_configs:
      - targets: ['postgres-exporter-crm:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
