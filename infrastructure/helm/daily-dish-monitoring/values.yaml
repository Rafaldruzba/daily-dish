imagePullPolicy: IfNotPresent

prometheus:
  image: prom/prometheus:v2.54.1
  port: 9090
  retention: 15d
  storage: 5Gi

grafana:
  image: grafana/grafana:11.2.0
  port: 3000
  storage: 2Gi

blackbox:
  image: prom/blackbox-exporter:v0.25.0
  port: 9115

postgresExporter:
  image: prometheuscommunity/postgres-exporter:v0.15.0
  port: 9187
  databaseUri: postgres:5432/daily_dish?sslmode=disable

postgresCrmExporter:
  databaseUri: postgres-crm:5432/crm_console?sslmode=disable

redisExporter:
  image: oliver006/redis_exporter:v1.62.0
  port: 9121

secrets:
  app: daily-dish-secrets
  monitoring: daily-dish-monitoring-secrets
