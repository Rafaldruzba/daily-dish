apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  labels:
    app.kubernetes.io/name: blackbox
    app.kubernetes.io/part-of: daily-dish-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox
        app.kubernetes.io/part-of: daily-dish-monitoring
    spec:
      containers:
        - name: blackbox
          image: {{ .Values.blackbox.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: {{ .Values.blackbox.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: blackbox-config
