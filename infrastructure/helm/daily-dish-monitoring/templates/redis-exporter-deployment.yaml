apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: daily-dish-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: daily-dish-monitoring
    spec:
      containers:
        - name: exporter
          image: {{ .Values.redisExporter.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.redisExporter.port }}
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
