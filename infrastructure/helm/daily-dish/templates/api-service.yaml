apiVersion: v1
kind: Service
metadata:
  name: daily-dish-api
  labels:
    app.kubernetes.io/name: daily-dish-api
    app.kubernetes.io/part-of: daily-dish
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: daily-dish-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
