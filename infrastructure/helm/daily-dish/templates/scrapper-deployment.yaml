apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapper
  labels:
    app.kubernetes.io/name: scrapper
    app.kubernetes.io/part-of: daily-dish
spec:
  replicas: {{ .Values.scrapper.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scrapper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrapper
        app.kubernetes.io/part-of: daily-dish
    spec:
      containers:
        - name: scrapper
          image: {{ .Values.scrapper.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.scrapper.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.scrapper.port | quote }}
            - name: APIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: APIFY_TOKEN
                  optional: true
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: SCRAPPER_METRICS_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
