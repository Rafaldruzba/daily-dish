apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-crm
  labels:
    app.kubernetes.io/name: postgres-crm
    app.kubernetes.io/part-of: daily-dish
spec:
  serviceName: postgres-crm
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-crm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-crm
        app.kubernetes.io/part-of: daily-dish
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresCrm.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_POSTGRES_DB
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresCrm.storage }}
