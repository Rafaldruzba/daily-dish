apiVersion: v1
kind: Service
metadata:
  name: console-backend
  labels:
    app.kubernetes.io/name: console-backend
    app.kubernetes.io/part-of: daily-dish
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: console-backend
  ports:
    - name: http
      port: {{ .Values.consoleBackend.port }}
      targetPort: http
