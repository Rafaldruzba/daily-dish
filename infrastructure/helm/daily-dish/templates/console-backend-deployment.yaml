apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-backend
  labels:
    app.kubernetes.io/name: console-backend
    app.kubernetes.io/part-of: daily-dish
spec:
  replicas: {{ .Values.consoleBackend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: console-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-backend
        app.kubernetes.io/part-of: daily-dish
    spec:
      containers:
        - name: backend
          image: {{ .Values.consoleBackend.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.consoleBackend.port }}
          envFrom:
            - configMapRef:
                name: console-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_JWT_SECRET
            - name: BISTRO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BISTRO_API_TOKEN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: ADMIN_PASSWORD
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CRM_METRICS_TOKEN
                  optional: true
            - name: RESEND_API
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RESEND_API
                  optional: true
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GOOGLE_MAPS_API_KEY
                  optional: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
