apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-frontend
  labels:
    app.kubernetes.io/name: console-frontend
    app.kubernetes.io/part-of: daily-dish
spec:
  replicas: {{ .Values.consoleFrontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: console-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-frontend
        app.kubernetes.io/part-of: daily-dish
    spec:
      containers:
        - name: frontend
          image: {{ .Values.consoleFrontend.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.consoleFrontend.port }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
