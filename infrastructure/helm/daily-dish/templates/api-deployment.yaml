apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-dish-api
  labels:
    app.kubernetes.io/name: daily-dish-api
    app.kubernetes.io/part-of: daily-dish
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: daily-dish-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daily-dish-api
        app.kubernetes.io/part-of: daily-dish
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: API_JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: API_ADMIN_EMAIL
            - name: BISTRO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BISTRO_API_TOKEN
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: API_METRICS_TOKEN
                  optional: true
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GMAIL_USER
                  optional: true
            - name: GMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GMAIL_PASS
                  optional: true
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: GOOGLE_MAPS_API_KEY
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: RECAPTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RECAPTCHA_SECRET
                  optional: true
            - name: RESEND_API
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RESEND_API
                  optional: true
            - name: BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BUCKET_NAME
                  optional: true
            - name: BUCKET_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BUCKET_URL
                  optional: true
            - name: BUCKET_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BUCKET_ACCESS_KEY_ID
                  optional: true
            - name: BUCKET_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BUCKET_SECRET_ACCESS_KEY
                  optional: true
            - name: STRIPE_PRICE_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: STRIPE_PRICE_BASE
                  optional: true
            - name: STRIPE_PRICE_PROMOTION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: STRIPE_PRICE_PROMOTION
                  optional: true
          envFrom:
            - configMapRef:
                name: daily-dish-api-config
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
