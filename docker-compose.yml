services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: daily_dish_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-daily_dish}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Osobna instancja bazy dla panelu CRM (console.bistromapa.app)
  # Wymaga w console.bistromapa.app/backend/.env portu 5433, nie 5432.
  postgres-crm:
    image: postgres:16-alpine
    container_name: crm_console
    restart: always
    environment:
      POSTGRES_USER: ${CRM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CRM_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${CRM_POSTGRES_DB:-crm_console}
    ports:
      - '5433:5432'
    volumes:
      - crm_console_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CRM_POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: daily_dish_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  crm_console_data:
  redis_data:
